[project]
name = "universal-storage"
version = "0.1.0"
description = "Universal async storage library with repository pattern and optimistic locking"
authors = [
    { name = "Winder Krons", email = "winder.krons@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
]

[project.scripts]
storage-init-alembic = "storage.cli.main:cli_entrypoint"

[project.optional-dependencies]
sql = [
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
]
postgres = [
    "universal-storage[sql]",
    "asyncpg>=0.29,<1.0",
]
sqlite = [
    "universal-storage[sql]",
    "aiosqlite>=0.20,<1.0",
]
mysql = [
    "universal-storage[sql]",
    "aiomysql>=0.2,<1.0",
]
mongo = [
    "beanie>=1.26,<2.0",
    "motor>=3.4,<4.0",
]
redis = [
    "redis>=5.0,<6.0",
]
all = [
    "universal-storage[postgres,sqlite,mysql,mongo,redis]",
]

[project.urls]
Telegram = "https://t.me/winder_krons"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage"]
include = [
    "src/storage/adapters/sql/templates/*",
    "src/storage/adapters/sql/templates/versions/.gitkeep",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "beanie>=1.30.0",
    "fakeredis>=2.41.0",
    "mongomock-motor>=0.0.36",
    "motor>=3.7.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

