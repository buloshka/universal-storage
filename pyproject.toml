[project]
name = "universal-storage"
version = "0.1.0"
description = "Universal async storage library with repository pattern and optimistic locking"
authors = [
    { name = "Winder Krons", email = "winder.krons@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
sql = [
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
]
postgres = [
    "universal-storage[sql]",
    "asyncpg>=0.29,<1.0",
]
sqlite = [
    "universal-storage[sql]",
    "aiosqlite>=0.20,<1.0",
]
mysql = [
    "universal-storage[sql]",
    "aiomysql>=0.2,<1.0",
]
mongo = [
    "beanie>=1.26,<2.0",
    "motor>=3.4,<4.0",
]
redis = [
    "redis>=5.0,<6.0",
]
all = [
    "universal-storage[postgres,sqlite,mysql,mongo,redis]",
]

[project.urls]
Telegram = "https://t.me/winder_krons"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "sqlalchemy[asyncio]>=2.1.9",
]
